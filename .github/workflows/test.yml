name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine tests
        run: node --test engine/tax-engine.test.mjs
      - name: Build single-file dist
        run: node build.mjs
      - name: Verify build output is fresh
        run: git diff --exit-code index.html || (echo "::error::index.html 与 template/engine 不一致，请重新运行 node build.mjs 并提交" && exit 1)
